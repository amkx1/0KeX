<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Blogs | kelog</title>
    <style>
        /* ── BLOGS-SPECIFIC ── */

        .page-intro {
            padding: 1.4rem;
        }

        .page-intro-greeting {
            font-size: 0.68rem;
            color: var(--text-dim);
            margin-bottom: 0.3rem;
            letter-spacing: 0.05em;
        }

        .page-intro-title {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--text);
            letter-spacing: -1px;
            line-height: 1;
            margin-bottom: 0.5rem;
        }

        .page-intro-title span {
            color: var(--red);
            opacity: 0.7;
            font-weight: 300;
        }

        .page-intro-sub {
            font-size: 0.73rem;
            color: var(--text-mid);
            line-height: 1.8;
            border-left: 2px solid rgba(220, 30, 50, 0.3);
            padding-left: 0.9rem;
            max-width: 480px;
        }

        /* ── CATEGORY CARD HEADER (clickable toggle) ── */
        .category-card-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.2rem 0.8rem;
            border-bottom: 1px solid var(--border2);
            cursor: pointer;
            user-select: none;
            transition: background 0.15s;
        }

        .category-card-head:hover {
            background: var(--red-soft);
        }

        .category-card-head .card-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text);
        }

        .category-card-head .card-title i.folder-icon {
            color: var(--red);
            font-size: 0.72rem;
            transition: transform 0.2s;
        }

        .dir-arrow {
            font-size: 0.55rem;
            color: var(--red);
            transition: transform 0.2s;
        }

        /* When card is closed, rotate arrow and swap folder icon */
        .category-card.closed .dir-arrow {
            transform: rotate(-90deg);
        }

        .category-card.closed .folder-icon {
            /* closed folder */
        }

        /* ── COLLAPSIBLE BODY ── */
        .category-body {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .category-card.closed .category-body {
            max-height: 0;
        }

        /* ── BLOG ROW ── */
        .blog-row {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: baseline;
            gap: 1rem;
            padding: 0.6rem 1.2rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.15s;
            margin-bottom: 0.1rem;
        }

        .blog-row:hover {
            background: rgba(220, 30, 50, 0.05);
        }

        .blog-row:hover .blog-row-title {
            color: var(--red);
        }

        .blog-row-left {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            min-width: 0;
        }

        .blog-row-prefix {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-right: 0.3rem;
        }

        .blog-row-title {
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text);
            transition: color 0.15s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .blog-row-excerpt {
            font-size: 0.67rem;
            color: var(--text-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-left: 1.1rem;
        }

        .blog-row-date {
            font-size: 0.63rem;
            color: var(--text-dim);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .blog-rows-wrap {
            padding: 0.5rem 0;
        }

        /* Empty / loading */
        .status-text {
            padding: 1.5rem 1.2rem;
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        .status-text::before {
            content: '// ';
            color: var(--red);
        }

        @media (max-width: 600px) {
            .blog-row {
                grid-template-columns: 1fr;
            }

            .blog-row-date {
                display: none;
            }
        }
    </style>
</head>

<body>

    <canvas id="bg-canvas"></canvas>

    <div class="shell">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-wrap">
                <a href="index.html" class="logo">
                    <div class="logo-dot"></div>
                    KΞLØG
                </a>
            </div>

            <div class="nav-section">
                <div class="nav-label">Menu</div>
                <a href="index.html" class="nav-item"><i class="fas fa-house"></i> home</a>
                <a href="about.html" class="nav-item"><i class="fas fa-user"></i> about</a>
                <a href="projects.html" class="nav-item"><i class="fas fa-code-branch"></i> projects</a>
                <a href="blogs.html" class="nav-item active"><i class="fas fa-file-lines"></i> blog</a>
            </div>

            <div class="sidebar-footer">
                <div class="avatar-sm">K</div>
                <div class="footer-info">
                    <div class="footer-name">kelog</div>
                    <div class="footer-sub">cybersec / engineer</div>
                </div>
            </div>
        </aside>

        <!-- MAIN -->
        <div class="main">

            <!-- TOPBAR -->
            <div class="topbar">
                <div class="topbar-title">Blog</div>
                <div class="topbar-right">
                    <a href="contact.html" class="pill"><i class="fas fa-envelope"></i> contact me</a>
                </div>
            </div>

            <!-- CONTENT -->
            <div class="content" style="flex-direction:column;gap:1.2rem;align-items:stretch;">

                <!-- INTRO CARD -->
                <div class="card">
                    <div class="card-head">
                        <div class="card-title"><i class="fas fa-terminal"></i> ls ~/portfolio/blogs/</div>
                        <span id="totalCount" style="font-size:0.65rem;color:var(--text-dim);"></span>
                    </div>
                    <div class="page-intro">
                        <div class="page-intro-greeting">// the archives</div>
                        <div class="page-intro-title">Blogs & Writeups</div>
                        <p class="page-intro-sub">I share what I learn here ;)</p>
                    </div>
                </div>

                <!-- CATEGORY CARDS injected here -->
                <div id="blogList" style="display:flex;flex-direction:column;gap:1.2rem;">
                    <div class="card">
                        <div class="status-text">fetching posts...</div>
                    </div>
                </div>

                <div id="noResults" style="display:none;">
                    <div class="card">
                        <div class="status-text">no posts found</div>
                    </div>
                </div>

            </div><!-- /content -->

            <footer class="footer">
                <span>© 2026 kelog. Stay <span style="color:var(--red)">curious</span>.</span>
                <span>Built Curious. Wired Secure.</span>
            </footer>

        </div><!-- /main -->
    </div><!-- /shell -->

    <script>
        /* BACKGROUND CANVAS */
        (function () {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let W, H, particles;
            const RED = '220,30,50';

            function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }

            function makeParticles() {
                particles = [];
                const count = Math.floor((W * H) / 22000);
                for (let i = 0; i < count; i++) {
                    particles.push({
                        x: Math.random() * W, y: Math.random() * H,
                        r: Math.random() * 1.2 + 0.3,
                        vx: (Math.random() - 0.5) * 0.15,
                        vy: (Math.random() - 0.5) * 0.15,
                        alpha: Math.random() * 0.4 + 0.1,
                    });
                }
            }

            function draw() {
                ctx.clearRect(0, 0, W, H);
                ctx.strokeStyle = `rgba(${RED},0.04)`;
                ctx.lineWidth = 1;
                const gs = 60;
                for (let x = 0; x < W; x += gs) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
                for (let y = 0; y < H; y += gs) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
                particles.forEach(p => {
                    p.x += p.vx; p.y += p.vy;
                    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
                    if (p.y < 0) p.y = H; if (p.y > H) p.y = 0;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(${RED},${p.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(draw);
            }

            resize(); makeParticles(); draw();
            window.addEventListener('resize', () => { resize(); makeParticles(); });
        })();

        /* TOGGLE */
        function toggleCard(head) {
            head.closest('.category-card').classList.toggle('closed');
            const folderIcon = head.querySelector('.folder-icon');
            const isClosed = head.closest('.category-card').classList.contains('closed');
            folderIcon.className = isClosed
                ? 'fas fa-folder folder-icon'
                : 'fas fa-folder-open folder-icon';
        }

        /* BLOG LOADER */
        async function loadBlogs() {
            const list = document.getElementById('blogList');
            const noResults = document.getElementById('noResults');

            try {
                const response = await fetch('blogs.json');
                const data = await response.json();
                const blogs = data.blogs;

                if (!blogs || blogs.length === 0) {
                    list.style.display = 'none';
                    noResults.style.display = 'block';
                    return;
                }

                document.getElementById('totalCount').textContent =
                    `${blogs.length} post${blogs.length !== 1 ? 's' : ''}`;

                // Group by category
                const grouped = {};
                blogs.forEach(blog => {
                    if (!grouped[blog.category]) grouped[blog.category] = [];
                    grouped[blog.category].push(blog);
                });

                list.innerHTML = '';

                Object.entries(grouped).forEach(([category, posts]) => {
                    const card = document.createElement('div');
                    card.className = 'card category-card'; // open by default

                    card.innerHTML = `
                        <div class="category-card-head" onclick="toggleCard(this)">
                            <div class="card-title">
                                <i class="fas fa-folder-open folder-icon"></i> ${category}/
                            </div>
                            <div style="display:flex;align-items:center;gap:0.8rem;">
                                <span style="font-size:0.65rem;color:var(--text-dim);">${posts.length} post${posts.length !== 1 ? 's' : ''}</span>
                                <i class="fas fa-chevron-down dir-arrow"></i>
                            </div>
                        </div>
                        <div class="category-body">
                            <div class="blog-rows-wrap">
                                ${posts.map((blog, idx) => `
                                    <div class="blog-row" onclick="window.location.href='blog.html?id=${blog.id}'">
                                        <div class="blog-row-left">
                                            <span class="blog-row-title">
                                                <span class="blog-row-prefix">${idx === posts.length - 1 ? '└─' : '├─'}</span>
                                                ${blog.title}
                                            </span>
                                            <span class="blog-row-excerpt">${blog.excerpt}</span>
                                        </div>
                                        <span class="blog-row-date">${blog.date}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;

                    list.appendChild(card);
                });

            } catch (e) {
                list.style.display = 'none';
                noResults.style.display = 'block';
            }
        }

        loadBlogs();
    </script>

</body>

</html>
